apiVersion: policy.sigstore.dev/v1alpha1
kind: ClusterImagePolicy
metadata:
  name: image-is-signed-by-cosign
spec:
  images:
    - glob: "docker.io/bells17/cscs-example@*"
  authorities:
    - keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subjectRegExp: "^https://github.com/wrong-org/wrong-repo/.github/workflows/build-and-example.yml@refs/tags/v[0-9]+.[0-9]+.[0-9]+$"
